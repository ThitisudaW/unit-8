<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SUPER NIHONGO FLIP - Satit Patumwan × Meikei</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DotGothic16&family=M+PLUS+Rounded+1c:wght@700;800;900&family=Mali:wght@600;700&family=Press+Start+2P&family=Prompt:wght@600;700&display=swap" rel="stylesheet">
  
  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>

  <style>
    :root {
      --sky-top: #070b1e;
      --sky-mid: #12204a;
      --sky-bottom: #1e3875;
      --hill-dark: #09361d;
      --hill-main: #116335;
      --hill-highlight: #229954;
      --ground-top: #2ecc71;
      --ground-dirt: #9c4a1a;
      --ground-dark: #5c280a;
      --brick-dark: #132a4a;
      --brick-border: #3b76bd;
      --q-gold: #ffca28;
      --q-gold-light: #fff08a;
      --q-gold-dark: #d98200;
      --pipe-green: #00c800;
      --pipe-light: #7dff7d;
      --pipe-dark: #005c00;
      --mario-red: #ff3b30;
    }

    * { box-sizing: border-box; user-select: none; }

    body {
      margin: 0;
      min-height: 100vh;
      background: linear-gradient(180deg, var(--sky-top) 0%, var(--sky-mid) 55%, var(--sky-bottom) 100%);
      color: #fff;
      font-family: 'DotGothic16', 'M PLUS Rounded 1c', sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding-bottom: 130px;
      position: relative;
      overflow-x: hidden;
    }

    /* ================= ฉากหลังหน้าเกมหลัก (Sky & Hills) ================= */
    .mario-scenery {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
    }

    .stars {
      position: absolute;
      inset: 0;
      background-image:
        radial-gradient(2px 2px at 8% 14%, #ffffff, transparent),
        radial-gradient(3px 3px at 22% 9%, #ffe066, transparent),
        radial-gradient(2px 2px at 38% 19%, #ffffff, transparent),
        radial-gradient(3px 3px at 56% 11%, #a5f3fc, transparent),
        radial-gradient(2px 2px at 74% 16%, #ffffff, transparent),
        radial-gradient(3px 3px at 89% 10%, #ffe066, transparent);
      animation: twinkle 2.4s infinite alternate ease-in-out;
    }
    @keyframes twinkle { 0% { opacity: 0.5; } 100% { opacity: 1; } }

    .kawaii-cloud {
      position: absolute;
      opacity: 0.95;
      filter: drop-shadow(0 4px 0 rgba(7, 15, 43, 0.55));
      animation: floatCloud linear infinite;
    }
    .cloud-a { top: 12%; width: 125px; animation-duration: 36s; }
    .cloud-b { top: 22%; width: 95px; animation-duration: 48s; animation-delay: -18s; }
    @keyframes floatCloud {
      from { transform: translateX(-160px); }
      to { transform: translateX(calc(100vw + 180px)); }
    }

    .hill {
      position: absolute;
      bottom: 64px;
      background: linear-gradient(180deg, var(--hill-highlight) 0%, var(--hill-main) 30%, var(--hill-dark) 100%);
      border: 4px solid #041f10;
      border-bottom: none;
      border-radius: 50% 50% 0 0 / 85% 85% 0 0;
    }
    .hill-1 { left: -30px; width: 250px; height: 190px; }
    .hill-2 { left: 24%; width: 160px; height: 115px; opacity: 0.9; }
    .hill-3 { right: 14%; width: 290px; height: 215px; }

    .mario-bush {
      position: absolute;
      bottom: 64px;
      transform-origin: bottom center;
      animation: bushWobble 2.2s infinite ease-in-out;
    }
    .bush-left { left: 17%; width: 115px; }
    .bush-right { right: 16%; width: 105px; animation-delay: 1s; }
    @keyframes bushWobble {
      0%, 100% { transform: scaleY(1) scaleX(1); }
      50% { transform: scaleY(1.06) scaleX(0.97); }
    }

    .warp-pipe {
      position: absolute;
      bottom: 64px;
      right: 3.5%;
      width: 64px;
      height: 86px;
      background: linear-gradient(90deg, var(--pipe-dark) 0%, var(--pipe-green) 30%, var(--pipe-light) 48%, var(--pipe-green) 70%, var(--pipe-dark) 100%);
      border: 4px solid #002900;
      border-bottom: none;
    }
    .warp-pipe::before {
      content: "";
      position: absolute;
      top: -22px; left: -8px; right: -8px; height: 22px;
      background: inherit;
      border: 4px solid #002900;
    }

    .student-duo {
      position: absolute;
      bottom: 64px;
      left: 4%;
      display: flex;
      align-items: flex-end;
      gap: 10px;
      filter: drop-shadow(3px 3px 0 rgba(0,0,0,0.5));
    }
    .student-unit {
      display: flex;
      flex-direction: column;
      align-items: center;
      transform-origin: bottom center;
      animation: studentIdle 1.3s infinite ease-in-out;
    }
    .student-unit.meikei { animation-delay: 0.35s; }
    .school-tag {
      font-family: 'M PLUS Rounded 1c', 'Prompt', sans-serif;
      font-size: 9px;
      font-weight: 900;
      padding: 2px 6px;
      border-radius: 6px;
      margin-bottom: 3px;
      white-space: nowrap;
      border: 1.5px solid #fff;
    }
    .school-tag.patumwan { background: #1d4ed8; color: #fff; }
    .school-tag.meikei { background: #991b1b; color: #fef08a; }
    .student-sprite { width: 54px; height: 74px; }
    @keyframes studentIdle { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-2px); } }
    .student-duo.jump .student-unit { animation: studentJump 0.65s cubic-bezier(0.25, 1, 0.5, 1); }
    @keyframes studentJump { 0% { transform: translateY(0); } 45% { transform: translateY(-62px); } 100% { transform: translateY(0); } }

    .mario-ground {
      position: absolute;
      bottom: 0; left: 0; right: 0; height: 64px;
      background-color: var(--ground-dirt);
      background-image:
        linear-gradient(180deg, #86efac 0px, #86efac 6px, var(--ground-top) 6px, var(--ground-top) 16px, #052e16 16px, #052e16 20px, transparent 20px),
        linear-gradient(90deg, rgba(0,0,0,0.35) 2px, transparent 2px),
        linear-gradient(0deg, rgba(0,0,0,0.35) 2px, transparent 2px);
      background-size: 100% 100%, 32px 22px, 32px 22px;
      border-top: 4px solid #052e16;
    }

    /* ================= หน้าจอ FULL-SCREEN LOBBY (โรงเรียนไทย × 8-Bit Mario) ================= */
    .lobby-fullscreen {
      position: fixed;
      inset: 0;
      z-index: 100;
      background: linear-gradient(180deg, #1e90ff 0%, #56b4ff 52%, #b5e4ff 100%);
      display: flex;
      flex-direction: column;
      overflow-y: auto;
      padding-bottom: 120px;
    }
    .lobby-fullscreen.hidden { display: none; }

    .thai-school-scenery {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 101;
      overflow: hidden;
    }

    .morning-sun {
      position: absolute;
      top: 84px;
      left: 7%;
      width: 60px;
      height: 60px;
      background: #fde047;
      border: 4px solid #ca8a04;
      border-radius: 50%;
      box-shadow: 0 0 28px rgba(253, 224, 71, 0.85);
      animation: sunBounce 3s infinite alternate ease-in-out;
    }
    @keyframes sunBounce { from { transform: scale(1); } to { transform: scale(1.06); } }

    .lobby-cloud {
      position: absolute;
      opacity: 0.96;
      filter: drop-shadow(0 4px 0 rgba(14, 116, 144, 0.3));
      animation: floatCloud linear infinite;
    }
    .l-cloud-1 { top: 14%; width: 118px; animation-duration: 34s; }
    .l-cloud-2 { top: 24%; width: 92px; animation-duration: 46s; animation-delay: -18s; }

    .lobby-bush {
      position: absolute;
      bottom: 64px;
      transform-origin: bottom center;
      animation: bushWobble 2.2s infinite ease-in-out;
    }
    .l-bush-1 { left: 2%; width: 95px; }
    .l-bush-2 { right: 2%; width: 105px; animation-delay: 0.8s; }

    .thai-school-building {
      position: absolute;
      bottom: 64px;
      right: 6%;
      width: 250px;
      height: 195px;
      filter: drop-shadow(4px 4px 0 rgba(15, 23, 42, 0.35));
    }

    .thai-flagpole-wrap {
      position: absolute;
      bottom: 64px;
      left: 11%;
      width: 110px;
      height: 215px;
      filter: drop-shadow(3px 3px 0 rgba(15, 23, 42, 0.3));
    }
    .thai-flag-wave {
      transform-origin: 18px 25px;
      animation: thaiFlagFlutter 0.85s infinite alternate ease-in-out;
    }
    @keyframes thaiFlagFlutter {
      from { transform: skewY(-4deg) scaleX(0.95); }
      to { transform: skewY(4deg) scaleX(1.04); }
    }

    .school-characters-group {
      position: absolute;
      bottom: 64px;
      left: 22%;
      display: flex;
      align-items: flex-end;
      gap: 14px;
      filter: drop-shadow(3px 3px 0 rgba(15, 23, 42, 0.35));
    }

    .char-box {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .char-label {
      font-family: 'M PLUS Rounded 1c', 'Prompt', sans-serif;
      font-size: 9px;
      font-weight: 900;
      padding: 2px 7px;
      border-radius: 6px;
      margin-bottom: 3px;
      border: 1.5px solid #fff;
      white-space: nowrap;
    }
    .char-label.teacher { background: #db2777; color: #fff; }
    .char-label.st-th { background: #1d4ed8; color: #fff; }
    .char-label.st-jp { background: #991b1b; color: #fef08a; }

    .teacher-sprite {
      width: 60px;
      height: 82px;
      transform-origin: bottom center;
      animation: teacherGreet 1.5s infinite ease-in-out;
    }
    .teacher-arm {
      transform-origin: 13px 9px;
      animation: teacherWaveArm 0.75s infinite alternate ease-in-out;
    }
    @keyframes teacherGreet {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-3px); }
    }
    @keyframes teacherWaveArm {
      from { transform: rotate(-14deg); }
      to { transform: rotate(18deg); }
    }

    .lobby-student-sprite {
      width: 52px;
      height: 72px;
      transform-origin: bottom center;
      animation: studentHopLobby 1.8s infinite ease-in-out;
    }
    .lobby-student-sprite.delay { animation-delay: 0.45s; }
    @keyframes studentHopLobby {
      0%, 70%, 100% { transform: translateY(0); }
      82% { transform: translateY(-14px); }
      92% { transform: translateY(0); }
    }

    .schoolyard-ground {
      position: absolute;
      bottom: 0; left: 0; right: 0;
      height: 64px;
      background-color: #cbd5e1;
      background-image:
        linear-gradient(180deg, #86efac 0px, #86efac 5px, #22c55e 5px, #22c55e 16px, #052e16 16px, #052e16 20px, transparent 20px),
        linear-gradient(90deg, rgba(71, 85, 105, 0.4) 3px, transparent 3px),
        linear-gradient(0deg, rgba(71, 85, 105, 0.4) 3px, transparent 3px);
      background-size: 100% 100%, 36px 22px, 36px 22px;
      border-top: 4px solid #052e16;
    }

    .lobby-topbar {
      background: rgba(15, 23, 42, 0.92);
      backdrop-filter: blur(6px);
      border-bottom: 4px solid var(--q-gold);
      padding: 14px 24px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      box-shadow: 0 6px 24px rgba(0, 0, 0, 0.35);
      position: relative;
      z-index: 105;
    }

    .lobby-brand { display: flex; flex-direction: column; gap: 5px; }
    .lobby-brand-title {
      font-family: 'Press Start 2P', monospace;
      font-size: clamp(14px, 2.2vw, 20px);
      color: var(--q-gold);
      text-shadow: 3px 3px 0 #b91c1c;
    }
    .lobby-brand-sub {
      font-family: 'M PLUS Rounded 1c', sans-serif;
      font-size: 12px;
      font-weight: 800;
      color: #bae6fd;
    }

    .lobby-counter-pill {
      background: #1e3a8a;
      border: 3px solid #60a5fa;
      padding: 10px 18px;
      border-radius: 10px;
      font-family: 'Press Start 2P', monospace;
      font-size: 12px;
      color: #fff;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .lobby-join-bar {
      max-width: 700px;
      width: 92%;
      margin: 22px auto 12px;
      background: rgba(15, 23, 42, 0.9);
      backdrop-filter: blur(6px);
      border: 4px solid var(--q-gold);
      border-radius: 16px;
      padding: 16px 20px;
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: center;
      justify-content: center;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
      position: relative;
      z-index: 105;
    }

    .name-input {
      flex: 1;
      min-width: 220px;
      padding: 13px 16px;
      font-family: 'M PLUS Rounded 1c', 'Prompt', sans-serif;
      font-size: 18px;
      font-weight: 800;
      text-align: center;
      border-radius: 10px;
      border: 4px solid #60a5fa;
      background: #090e1c;
      color: #fff;
      outline: none;
      user-select: text;
    }
    .name-input:focus {
      border-color: var(--q-gold);
      box-shadow: 0 0 15px rgba(255, 202, 40, 0.45);
    }

    .lobby-arena {
      flex: 1;
      max-width: 1120px;
      width: 94%;
      margin: 10px auto;
      background: rgba(15, 23, 42, 0.78);
      backdrop-filter: blur(5px);
      border: 4px solid rgba(255, 255, 255, 0.55);
      border-radius: 18px;
      padding: 20px 24px;
      display: flex;
      flex-direction: column;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
      position: relative;
      z-index: 105;
    }

    .lobby-status-banner {
      text-align: center;
      font-family: 'Press Start 2P', 'M PLUS Rounded 1c', sans-serif;
      font-size: clamp(11px, 1.6vw, 13px);
      color: #fef08a;
      text-shadow: 2px 2px 0 #0f172a;
      margin-bottom: 18px;
      animation: pulseText 1.6s infinite alternate ease-in-out;
    }
    @keyframes pulseText { from { opacity: 0.78; } to { opacity: 1; } }

    .blooket-players-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(170px, 1fr));
      gap: 14px;
      align-content: start;
    }

    .blook-card {
      background: linear-gradient(180deg, rgba(30, 58, 138, 0.96) 0%, rgba(23, 37, 84, 0.96) 100%);
      border: 4px solid #60a5fa;
      border-radius: 14px;
      padding: 14px 12px;
      text-align: center;
      box-shadow: 0 6px 0 #0f172a;
      animation: popBlook 0.35s cubic-bezier(0.18, 0.89, 0.32, 1.28);
    }

    .blook-card.is-host {
      background: linear-gradient(180deg, rgba(153, 27, 27, 0.96) 0%, rgba(69, 10, 10, 0.96) 100%);
      border-color: var(--q-gold);
      box-shadow: 0 6px 0 #260505, 0 0 20px rgba(255, 202, 40, 0.45);
    }

    .blook-card.is-me {
      outline: 3px solid #4ade80;
      outline-offset: 2px;
    }

    @keyframes popBlook {
      from { transform: scale(0.65) translateY(12px); opacity: 0; }
      to { transform: scale(1) translateY(0); opacity: 1; }
    }

    .blook-badge-num {
      display: inline-block;
      font-family: 'Press Start 2P', monospace;
      font-size: 11px;
      padding: 5px 10px;
      border-radius: 8px;
      background: #0f172a;
      border: 2px solid #93c5fd;
      color: #93c5fd;
      margin-bottom: 8px;
    }
    .blook-card.is-host .blook-badge-num {
      border-color: var(--q-gold);
      color: var(--q-gold);
    }

    .blook-name {
      font-family: 'M PLUS Rounded 1c', 'Prompt', sans-serif;
      font-weight: 900;
      font-size: 17px;
      color: #fff;
      word-break: break-word;
    }

    .blook-role-tag {
      display: inline-block;
      margin-top: 8px;
      font-family: 'Press Start 2P', monospace;
      font-size: 8px;
      padding: 4px 8px;
      border-radius: 6px;
      background: rgba(0, 0, 0, 0.45);
      color: #dbeafe;
    }
    .blook-card.is-host .blook-role-tag {
      background: var(--q-gold);
      color: #3b1d00;
    }

    .host-control-dock {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      background: rgba(15, 23, 42, 0.96);
      border-top: 4px solid var(--q-gold);
      padding: 14px 20px;
      display: none;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      gap: 12px;
      z-index: 120;
      box-shadow: 0 -8px 30px rgba(0, 0, 0, 0.85);
    }
    .host-control-dock.visible { display: flex; }

    .mode-pill-group { display: flex; gap: 8px; }
    .mode-pill {
      padding: 10px 14px; border-radius: 10px;
      border: 3px solid #3b82f6; background: #1e3a8a; color: #dbeafe;
      font-family: 'DotGothic16', sans-serif; font-size: 13px; cursor: pointer;
    }
    .mode-pill.selected { background: #1d4ed8; border-color: var(--q-gold); color: #fff; }

    /* ================= หน้าด่านเล่นเกม ================= */
    .hud, .header, .stage-bar, .game-layout, .controls {
      position: relative;
      z-index: 5;
    }

    .hud {
      width: 100%;
      max-width: 1220px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
      padding: 12px 20px;
      font-family: 'Press Start 2P', monospace;
      font-size: 11px;
      border-bottom: 4px solid var(--brick-border);
      background: rgba(8, 13, 34, 0.94);
      position: sticky;
      top: 0;
      z-index: 20;
    }

    .hud-item { display: flex; flex-direction: column; gap: 5px; align-items: center; }
    .hud-label { color: #93c5fd; font-size: 9px; }
    .hud-value { color: #fff; text-shadow: 2px 2px 0 #000; }
    .hud-timer { color: #4ade80; }
    .hud-player { color: var(--q-gold); font-family: 'M PLUS Rounded 1c', 'Prompt', sans-serif; font-size: 14px; font-weight: 900; }

    .header {
      text-align: center;
      margin: 14px 16px 8px;
      background: rgba(10, 17, 42, 0.78);
      padding: 10px 22px;
      border-radius: 14px;
      border: 3px solid rgba(255, 202, 40, 0.45);
    }

    .title {
      font-family: 'Press Start 2P', monospace;
      font-size: clamp(13px, 2.3vw, 18px);
      color: var(--q-gold);
      text-shadow: 3px 3px 0 #b91c1c;
      margin: 0 0 6px;
    }

    .legend { display: flex; justify-content: center; gap: 10px; flex-wrap: wrap; margin-top: 6px; }
    .badge { font-size: 12px; padding: 4px 12px; border-radius: 20px; border: 2px solid rgba(255,255,255,0.35); font-weight: 700; }
    .badge.jp { background: #7e22ce; }
    .badge.thai { background: #059669; }

    .stage-bar {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: center;
      margin: 8px 0 12px;
      padding: 0 12px;
    }
    .stage-btn {
      font-family: 'Press Start 2P', monospace;
      font-size: 10px;
      padding: 8px 11px;
      background: var(--brick-dark);
      color: #cbd5e1;
      border: 3px solid var(--brick-border);
      border-radius: 6px;
      cursor: pointer;
    }
    .stage-btn.active { background: var(--mario-red); border-color: #fda4af; color: #fff; }
    .stage-btn.cleared { border-color: var(--pipe-green); color: #86efac; }

    .game-layout {
      width: 100%;
      max-width: 1220px;
      padding: 0 16px;
      display: grid;
      grid-template-columns: 1fr;
      gap: 18px;
      align-items: start;
    }

    @media (min-width: 980px) {
      .game-layout { grid-template-columns: 1fr 340px; }
    }

    .board {
      width: 100%;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(125px, 1fr));
      gap: 14px;
      background: rgba(8, 14, 36, 0.58);
      padding: 18px;
      border-radius: 14px;
      border: 3px solid rgba(59, 118, 189, 0.45);
      min-height: 360px;
    }

    @media (min-width: 768px) {
      .board { grid-template-columns: repeat(4, 1fr); }
    }

    .card-slot-empty {
      aspect-ratio: 3 / 4;
      border-radius: 12px;
      border: 2px dashed rgba(255, 255, 255, 0.14);
      background: rgba(0, 0, 0, 0.18);
      display: flex;
      align-items: center;
      justify-content: center;
      color: rgba(255, 202, 40, 0.35);
      font-family: 'Press Start 2P', monospace;
      font-size: 12px;
    }

    .card {
      aspect-ratio: 3 / 4;
      perspective: 1000px;
      cursor: pointer;
      transition: transform 0.35s ease, opacity 0.35s ease;
    }
    .card.collecting { transform: translateX(60px) scale(0.35) rotate(12deg); opacity: 0; pointer-events: none; }
    .card-inner { position: relative; width: 100%; height: 100%; transition: transform 0.4s cubic-bezier(0.2, 0.85, 0.4, 1.2); transform-style: preserve-3d; }
    .card.flipped .card-inner { transform: rotateY(180deg); }
    .card-face {
      position: absolute; inset: 0; backface-visibility: hidden;
      border-radius: 12px; display: flex; flex-direction: column;
      align-items: center; justify-content: center; padding: 10px; text-align: center;
    }
    .card-front {
      background: linear-gradient(135deg, var(--q-gold-light) 0%, var(--q-gold) 50%, var(--q-gold-dark) 100%);
      border: 4px solid #452300;
      box-shadow: inset 3px 3px 0 rgba(255,255,255,0.7), 0 5px 0 #2b1600;
    }
    .q-mark { font-family: 'Press Start 2P', monospace; font-size: 28px; color: #fffbe6; text-shadow: 3px 3px 0 #783f00; }
    .card-back { transform: rotateY(180deg); border: 4px solid #fff; }
    .card-back.type-jp { background: radial-gradient(circle, #7e22ce, #2e1065); border-color: #d8b4fe; }
    .card-back.type-thai { background: radial-gradient(circle, #059669, #064e3b); border-color: #6ee7b7; }
    .type-tag { position: absolute; top: 8px; font-family: 'M PLUS Rounded 1c', sans-serif; font-weight: 800; font-size: 11px; padding: 2px 10px; border-radius: 10px; background: rgba(0,0,0,0.45); }
    .card-text { font-weight: 800; line-height: 1.3; }
    .type-jp .card-text { font-family: 'M PLUS Rounded 1c', sans-serif; font-size: clamp(20px, 2.6vw, 28px); color: #f5d0fe; }
    .type-thai .card-text { font-family: 'Mali', cursive, sans-serif; font-weight: 700; font-size: clamp(16px, 2vw, 21px); color: #d1fae5; }
    .card.wrong { animation: shakeWrong 0.4s ease; }
    @keyframes shakeWrong { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }

    .side-panel {
      background: rgba(9, 16, 40, 0.9);
      border: 4px solid var(--q-gold);
      border-radius: 14px;
      padding: 12px;
    }

    .side-tabs {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
      margin-bottom: 12px;
    }

    .side-tab-btn {
      font-family: 'Press Start 2P', 'DotGothic16', sans-serif;
      font-size: 9px;
      padding: 9px 6px;
      border-radius: 8px;
      border: 2px solid #3b76bd;
      background: #0d1b3e;
      color: #94a3b8;
      cursor: pointer;
      line-height: 1.4;
    }
    .side-tab-btn.active {
      background: var(--q-gold);
      border-color: #fff;
      color: #3b1d00;
      font-weight: 900;
    }

    .tab-pane { display: none; }
    .tab-pane.active { display: block; }

    .live-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
      max-height: 440px;
      overflow-y: auto;
    }

    .live-row {
      background: #0f2042;
      border: 2px solid #2b5c99;
      border-radius: 10px;
      padding: 8px 10px;
      display: flex;
      flex-direction: column;
      gap: 5px;
    }
    .live-row.finished {
      border-color: #4ade80;
      background: linear-gradient(135deg, #064e3b, #09261e);
    }
    .live-row.is-me { border-color: var(--q-gold); }

    .live-top { display: flex; justify-content: space-between; align-items: center; }
    .live-name { font-family: 'M PLUS Rounded 1c', 'Prompt', sans-serif; font-weight: 800; font-size: 14px; color: #fff; }
    .live-clock { font-family: 'Press Start 2P', monospace; font-size: 11px; color: #4ade80; }
    .live-bottom { display: flex; justify-content: space-between; align-items: center; font-size: 11px; color: #93c5fd; }
    .progress-bar-bg { width: 100%; height: 6px; background: #070d1f; border-radius: 4px; overflow: hidden; }
    .progress-bar-fill { height: 100%; background: linear-gradient(90deg, #38bdf8, #4ade80); transition: width 0.3s ease; }

    .collected-list { display: flex; flex-direction: column; gap: 10px; max-height: 440px; overflow-y: auto; }
    .empty-deck-hint { text-align: center; padding: 24px 10px; color: #94a3b8; font-size: 13px; border: 2px dashed rgba(148, 163, 184, 0.3); border-radius: 10px; }
    .matched-stack { background: linear-gradient(135deg, #102a43 0%, #09192f 100%); border: 2px solid #38bdf8; border-radius: 12px; padding: 10px; position: relative; }
    .stack-badge { position: absolute; top: -8px; right: 10px; background: var(--q-gold); color: #3b1d00; font-family: 'Press Start 2P', monospace; font-size: 9px; padding: 3px 6px; border-radius: 4px; }
    .stack-cards { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-top: 4px; }
    .mini-card { padding: 8px; border-radius: 8px; text-align: center; font-weight: 800; }
    .mini-card.jp { background: rgba(147, 51, 234, 0.35); color: #f3e8ff; font-family: 'M PLUS Rounded 1c', sans-serif; font-size: 16px; }
    .mini-card.thai { background: rgba(5, 150, 105, 0.35); color: #a7f3d0; font-family: 'Mali', cursive, sans-serif; font-weight: 700; font-size: 15px; }

    .controls { margin-top: 18px; display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }
    .mario-btn {
      font-family: 'Press Start 2P', 'DotGothic16', sans-serif;
      font-size: 12px; padding: 12px 18px;
      background: var(--pipe-green); color: #fff;
      border: 4px solid #003800; border-radius: 8px;
      box-shadow: inset 3px 3px 0 #86efac, 0 5px 0 #002b00;
      cursor: pointer; text-shadow: 2px 2px 0 #003800;
    }
    .mario-btn.secondary { background: #2563eb; border-color: #1e3a8a; box-shadow: inset 3px 3px 0 #93c5fd, 0 5px 0 #172554; text-shadow: 2px 2px 0 #172554; }
    .mario-btn.danger { background: #dc2626; border-color: #7f1d1d; box-shadow: inset 3px 3px 0 #fca5a5, 0 5px 0 #450a0a; text-shadow: 2px 2px 0 #450a0a; }
    .mario-btn:active { transform: translateY(3px); }

    .modal-backdrop {
      position: fixed; inset: 0; background: rgba(0, 0, 0, 0.86);
      display: none; align-items: center; justify-content: center; z-index: 60; padding: 20px;
    }
    .modal-backdrop.show { display: flex; }
    .modal-box {
      background: #0d152a; border: 5px solid var(--q-gold);
      padding: 24px 20px; max-width: 520px; width: 100%;
      text-align: center; border-radius: 16px; max-height: 90vh; overflow-y: auto;
    }
    .modal-title { font-family: 'Press Start 2P', monospace; font-size: 17px; color: var(--q-gold); margin-bottom: 12px; line-height: 1.5; }
    .leaderboard { text-align: left; background: #070d1f; border: 2px solid var(--q-gold); border-radius: 10px; padding: 12px; margin-bottom: 18px; }
    .lb-row { display: flex; justify-content: space-between; align-items: center; padding: 8px 10px; border-bottom: 1px solid rgba(255,255,255,0.1); font-size: 14px; }
    .lb-rank { font-family: 'Press Start 2P', monospace; font-size: 11px; width: 36px; }
    .lb-name { flex: 1; font-family: 'M PLUS Rounded 1c', 'Prompt', sans-serif; font-weight: 800; color: #fff; }
    .lb-time { font-family: 'Press Start 2P', monospace; font-size: 11px; color: #4ade80; margin-right: 10px; }
    .lb-pts { font-family: 'Press Start 2P', monospace; font-size: 10px; color: #fbbf24; }
  </style>
</head>
