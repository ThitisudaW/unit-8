  <style>
    :root {
      --sky-top: #040714;
      --sky-mid: #0c1738;
      --sky-bottom: #182b5c;
      --hill-dark: #072916;
      --hill-main: #0c4a27;
      --hill-highlight: #166e3b;
      --ground-top: #26a641;
      --ground-dirt: #7c3814;
      --ground-dark: #451c06;
      --brick-dark: #10243e;
      --brick-border: #2b5c99;
      --q-gold: #f8b800;
      --q-gold-light: #ffe066;
      --q-gold-dark: #b86f00;
      --pipe-green: #00a800;
      --pipe-light: #5cff5c;
      --pipe-dark: #004d00;
      --mario-red: #e52521;
    }

    * {
      box-sizing: border-box;
      user-select: none;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: linear-gradient(180deg, var(--sky-top) 0%, var(--sky-mid) 55%, var(--sky-bottom) 100%);
      color: #fff;
      font-family: 'DotGothic16', 'Noto Sans JP', sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding-bottom: 130px;
      position: relative;
      overflow-x: hidden;
    }

    /* ฉากหลังมาริโอ้กลางคืน (ดาว + ภูเขา + ท่อ + พื้นอิฐ) */
    .mario-scenery {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
    }

    /* ดวงดาวพิกเซล */
    .stars {
      position: absolute;
      inset: 0;
      background-image:
        radial-gradient(2px 2px at 10% 15%, #ffffff, transparent),
        radial-gradient(2px 2px at 25% 8%, #ffe066, transparent),
        radial-gradient(2px 2px at 42% 22%, #ffffff, transparent),
        radial-gradient(3px 3px at 60% 12%, #93c5fd, transparent),
        radial-gradient(2px 2px at 78% 18%, #ffffff, transparent),
        radial-gradient(2px 2px at 90% 9%, #ffe066, transparent),
        radial-gradient(2px 2px at 15% 35%, #ffffff, transparent),
        radial-gradient(2px 2px at 52% 32%, #ffffff, transparent),
        radial-gradient(2px 2px at 84% 38%, #93c5fd, transparent);
      opacity: 0.85;
      animation: twinkle 3s infinite alternate ease-in-out;
    }

    @keyframes twinkle {
      0% { opacity: 0.55; }
      100% { opacity: 1; }
    }

    /* ภูเขามาริโอ้ */
    .hill {
      position: absolute;
      bottom: 64px;
      background: linear-gradient(180deg, var(--hill-highlight) 0%, var(--hill-main) 25%, var(--hill-dark) 100%);
      border: 4px solid #03140b;
      border-bottom: none;
      border-radius: 50% 50% 0 0 / 85% 85% 0 0;
      box-shadow: inset 8px 8px 0 rgba(255,255,255,0.12);
    }

    /* ลายจุดบนภูเขาสไตล์ Super Mario World */
    .hill::before,
    .hill::after {
      content: "";
      position: absolute;
      width: 14px;
      height: 26px;
      background: #041c0f;
      border-radius: 8px;
      opacity: 0.65;
    }
    .hill::before { top: 28%; left: 34%; }
    .hill::after { top: 42%; right: 32%; }

    .hill-1 { left: -40px; width: 280px; height: 210px; }
    .hill-2 { left: 22%; width: 170px; height: 125px; opacity: 0.85; }
    .hill-3 { right: 14%; width: 320px; height: 240px; }
    .hill-4 { right: -50px; width: 190px; height: 140px; opacity: 0.9; }
