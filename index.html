<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SUPER NIHONGO FLIP - Mario Night World</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DotGothic16&family=Noto+Sans+JP:wght@700;900&family=Press+Start+2P&family=Prompt:wght@600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --sky-top: #070b1e;
      --sky-mid: #12204a;
      --sky-bottom: #1e3875;
      --hill-dark: #09361d;
      --hill-main: #116335;
      --hill-highlight: #229954;
      --ground-top: #2ecc71;
      --ground-dirt: #9c4a1a;
      --ground-dark: #5c280a;
      --brick-dark: #132a4a;
      --brick-border: #3b76bd;
      --q-gold: #ffca28;
      --q-gold-light: #fff08a;
      --q-gold-dark: #d98200;
      --pipe-green: #00c800;
      --pipe-light: #7dff7d;
      --pipe-dark: #005c00;
      --mario-red: #ff3b30;
    }

    * {
      box-sizing: border-box;
      user-select: none;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: linear-gradient(180deg, var(--sky-top) 0%, var(--sky-mid) 55%, var(--sky-bottom) 100%);
      color: #fff;
      font-family: 'DotGothic16', 'Noto Sans JP', sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding-bottom: 120px;
      position: relative;
      overflow-x: hidden;
    }

    /* ================= ฉากหลังมาริโอ้น่ารัก ๆ ================= */
    .mario-scenery {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
    }

    .stars {
      position: absolute;
      inset: 0;
      background-image:
        radial-gradient(2px 2px at 10% 15%, #ffffff, transparent),
        radial-gradient(3px 3px at 25% 9%, #ffe066, transparent),
        radial-gradient(2px 2px at 42% 20%, #ffffff, transparent),
        radial-gradient(3px 3px at 60% 12%, #a5f3fc, transparent),
        radial-gradient(2px 2px at 78% 17%, #ffffff, transparent),
        radial-gradient(3px 3px at 90% 10%, #ffe066, transparent),
        radial-gradient(2px 2px at 18% 32%, #ffffff, transparent),
        radial-gradient(2px 2px at 70% 28%, #fbcfe8, transparent);
      animation: twinkle 2.5s infinite alternate ease-in-out;
    }

    @keyframes twinkle {
      0% { opacity: 0.6; }
      100% { opacity: 1; }
    }

    /* ก้อนเมฆพิกเซลยิ้มน่ารัก */
    .cloud {
      position: absolute;
      background: rgba(255, 255, 255, 0.14);
      border-radius: 30px;
      border: 2px solid rgba(255, 255, 255, 0.25);
      animation: floatCloud 28s linear infinite;
    }
    .cloud::before, .cloud::after {
      content: "";
      position: absolute;
      background: inherit;
      border-radius: 50%;
    }
    .cloud-1 { top: 14%; left: -120px; width: 110px; height: 34px; animation-duration: 36s; }
    .cloud-1::before { width: 46px; height: 46px; top: -22px; left: 16px; }
    .cloud-1::after { width: 36px; height: 36px; top: -14px; right: 18px; }

    .cloud-2 { top: 24%; left: -150px; width: 140px; height: 40px; animation-duration: 46s; animation-delay: -15s; }
    .cloud-2::before { width: 56px; height: 56px; top: -26px; left: 22px; }
    .cloud-2::after { width: 44px; height: 44px; top: -18px; right: 24px; }

    @keyframes floatCloud {
      from { transform: translateX(-160px); }
      to { transform: translateX(calc(100vw + 200px)); }
    }

    /* ภูเขามาริโอ้ */
    .hill {
      position: absolute;
      bottom: 64px;
      background: linear-gradient(180deg, var(--hill-highlight) 0%, var(--hill-main) 30%, var(--hill-dark) 100%);
      border: 4px solid #041f10;
      border-bottom: none;
      border-radius: 50% 50% 0 0 / 85% 85% 0 0;
      box-shadow: inset 8px 8px 0 rgba(255,255,255,0.18);
    }
    .hill::before, .hill::after {
      content: "";
      position: absolute;
      width: 14px;
      height: 24px;
      background: #062b16;
      border-radius: 8px;
      opacity: 0.7;
    }
    .hill::before { top: 28%; left: 34%; }
    .hill::after { top: 42%; right: 32%; }

    .hill-1 { left: -30px; width: 260px; height: 195px; }
    .hill-2 { left: 20%; width: 160px; height: 115px; opacity: 0.9; }
    .hill-3 { right: 14%; width: 300px; height: 220px; }
    .hill-4 { right: -40px; width: 180px; height: 130px; }

    /* พุ่มไม้ */
    .bush {
      position: absolute;
      bottom: 64px;
      height: 36px;
      background: #22c55e;
      border: 4px solid #052e16;
      border-bottom: none;
      border-radius: 22px 22px 0 0;
      box-shadow: inset 0 6px 0 #86efac;
    }
    .bush-1 { left: 16%; width: 105px; }
    .bush-2 { right: 33%; width: 130px; }

    /* ท่อเขียว */
    .warp-pipe {
      position: absolute;
      bottom: 64px;
      right: 4%;
      width: 66px;
      height: 88px;
      background: linear-gradient(90deg, var(--pipe-dark) 0%, var(--pipe-green) 30%, var(--pipe-light) 48%, var(--pipe-green) 70%, var(--pipe-dark) 100%);
      border: 4px solid #002900;
      border-bottom: none;
    }
    .warp-pipe::before {
      content: "";
      position: absolute;
      top: -22px;
      left: -8px;
      right: -8px;
      height: 22px;
      background: linear-gradient(90deg, var(--pipe-dark) 0%, var(--pipe-green) 30%, var(--pipe-light) 48%, var(--pipe-green) 70%, var(--pipe-dark) 100%);
      border: 4px solid #002900;
    }

    /* ตัวละครมาริโอ้พิกเซลสุดน่ารัก */
    .mario-character {
      position: absolute;
      bottom: 64px;
      left: 7%;
      width: 56px;
      height: 70px;
      transform-origin: bottom center;
      animation: marioIdle 1.2s infinite ease-in-out;
      filter: drop-shadow(3px 3px 0 rgba(0,0,0,0.5));
    }

    @keyframes marioIdle {
      0%, 100% { transform: translateY(0) scaleY(1); }
      50% { transform: translateY(-2px) scaleY(1.03); }
    }

    .mario-character.jump {
      animation: marioJump 0.65s cubic-bezier(0.25, 1, 0.5, 1);
    }

    @keyframes marioJump {
      0% { transform: translateY(0) scale(1); }
      45% { transform: translateY(-65px) scale(1.08); }
      100% { transform: translateY(0) scale(1); }
    }

    /* พื้นมาริโอ้ */
    .mario-ground {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 64px;
      background-color: var(--ground-dirt);
      background-image:
        linear-gradient(180deg, #86efac 0px, #86efac 6px, var(--ground-top) 6px, var(--ground-top) 16px, #052e16 16px, #052e16 20px, transparent 20px),
        linear-gradient(90deg, rgba(0,0,0,0.35) 2px, transparent 2px),
        linear-gradient(0deg, rgba(0,0,0,0.35) 2px, transparent 2px);
      background-size: 100% 100%, 32px 22px, 32px 22px;
      border-top: 4px solid #052e16;
      box-shadow: inset 0 -8px 0 var(--ground-dark);
    }

    /* ================= เลเยอร์ UI เกม ================= */
    .hud, .header, .stage-bar, .game-layout, .controls {
      position: relative;
      z-index: 5;
    }

    .hud {
      width: 100%;
      max-width: 1180px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 14px 20px;
      font-family: 'Press Start 2P', monospace;
      font-size: 11px;
      letter-spacing: 1px;
      border-bottom: 4px solid var(--brick-border);
      background: rgba(8, 13, 34, 0.92);
      position: sticky;
      top: 0;
      z-index: 20;
      box-shadow: 0 6px 20px rgba(0,0,0,0.75);
    }

    .hud-item {
      display: flex;
      flex-direction: column;
      gap: 6px;
      align-items: center;
    }

    .hud-label { color: #93c5fd; font-size: 9px; }
    .hud-value { color: #fff; text-shadow: 2px 2px 0 #000; }

    .coin-icon {
      display: inline-block;
      width: 10px;
      height: 14px;
      background: var(--q-gold);
      border: 2px solid #fff;
      border-radius: 50%;
      margin-right: 4px;
      animation: coinSpin 1.2s infinite ease-in-out;
    }

    @keyframes coinSpin {
      0%, 100% { transform: scaleX(1); }
      50% { transform: scaleX(0.3); }
    }

    .header {
      text-align: center;
      margin: 18px 16px 10px;
      background: rgba(10, 17, 42, 0.78);
      padding: 14px 24px;
      border-radius: 14px;
      border: 3px solid rgba(255, 202, 40, 0.45);
      backdrop-filter: blur(4px);
      box-shadow: 0 8px 24px rgba(0,0,0,0.45);
    }

    .title {
      font-family: 'Press Start 2P', monospace;
      font-size: clamp(14px, 2.6vw, 21px);
      color: var(--q-gold);
      text-shadow: 3px 3px 0 #b91c1c, -1px -1px 0 #000;
      margin: 0 0 8px;
      line-height: 1.4;
    }

    .subtitle {
      font-size: 15px;
      color: #f1f5f9;
      margin: 0 0 10px;
    }

    .legend {
      display: flex;
      justify-content: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .badge {
      font-size: 12px;
      padding: 4px 12px;
      border-radius: 20px;
      border: 2px solid rgba(255,255,255,0.35);
      font-weight: 700;
    }
    .badge.hira { background: #2563eb; color: #eff6ff; }
    .badge.kanji { background: #9333ea; color: #faf5ff; }
    .badge.thai { background: #059669; color: #ecfdf5; }

    .stage-bar {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: center;
      margin: 12px 0 16px;
      padding: 0 12px;
    }

    .stage-btn {
      font-family: 'Press Start 2P', monospace;
      font-size: 11px;
      padding: 10px 14px;
      background: var(--brick-dark);
      color: #cbd5e1;
      border: 3px solid var(--brick-border);
      border-radius: 6px;
      cursor: pointer;
      box-shadow: 0 4px 0 #071120;
      transition: transform 0.1s, background 0.2s;
    }

    .stage-btn:hover { background: #1c3d6b; color: #fff; }
    .stage-btn.active {
      background: var(--mario-red);
      border-color: #fda4af;
      color: #fff;
      box-shadow: 0 4px 0 #7f1d1d;
    }
    .stage-btn.cleared {
      border-color: var(--pipe-green);
      color: #86efac;
    }

    /* ================= โครงสร้างกระดาน + กองไพ่ด้านข้าง ================= */
    .game-layout {
      width: 100%;
      max-width: 1180px;
      padding: 0 16px;
      display: grid;
      grid-template-columns: 1fr;
      gap: 20px;
      align-items: start;
    }

    @media (min-width: 960px) {
      .game-layout {
        grid-template-columns: 1fr 310px;
      }
    }

    /* กระดานการ์ดตรงกลาง */
    .board {
      width: 100%;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(125px, 1fr));
      gap: 12px;
      background: rgba(8, 14, 36, 0.55);
      padding: 16px;
      border-radius: 14px;
      border: 3px solid rgba(59, 118, 189, 0.45);
      min-height: 360px;
    }

    @media (min-width: 768px) {
      .board {
        grid-template-columns: repeat(6, 1fr);
      }
    }

    /* ช่องว่างเมื่อการ์ดถูกย้ายไปกองด้านข้างแล้ว */
    .card-slot-empty {
      aspect-ratio: 3 / 4;
      border-radius: 8px;
      border: 2px dashed rgba(255, 255, 255, 0.14);
      background: rgba(0, 0, 0, 0.18);
      display: flex;
      align-items: center;
      justify-content: center;
      color: rgba(255, 202, 40, 0.35);
      font-family: 'Press Start 2P', monospace;
      font-size: 12px;
      animation: fadeInSlot 0.4s ease;
    }

    @keyframes fadeInSlot {
      from { opacity: 0; transform: scale(0.9); }
      to { opacity: 1; transform: scale(1); }
    }

    /* การ์ด 3D Flip */
    .card {
      aspect-ratio: 3 / 4;
      perspective: 1000px;
      cursor: pointer;
      transition: transform 0.35s ease, opacity 0.35s ease;
    }

    /* เอฟเฟกต์ตอนการ์ดลอยเก็บเข้ากองด้านข้าง */
    .card.collecting {
      transform: translateX(60px) scale(0.35) rotate(12deg);
      opacity: 0;
      pointer-events: none;
    }

    .card-inner {
      position: relative;
      width: 100%;
      height: 100%;
      transition: transform 0.42s cubic-bezier(0.2, 0.85, 0.4, 1.2);
      transform-style: preserve-3d;
    }

    .card.flipped .card-inner {
      transform: rotateY(180deg);
    }

    .card-face {
      position: absolute;
      inset: 0;
      backface-visibility: hidden;
      border-radius: 8px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 8px;
      text-align: center;
    }

    /* ด้านหลังการ์ด: กล่อง ? Block น่ารัก */
    .card-front {
      background: linear-gradient(135deg, var(--q-gold-light) 0%, var(--q-gold) 50%, var(--q-gold-dark) 100%);
      border: 4px solid #452300;
      box-shadow:
        inset 3px 3px 0 rgba(255,255,255,0.7),
        inset -3px -3px 0 rgba(0,0,0,0.35),
        0 5px 0 #2b1600;
    }

    .card-front:hover {
      filter: brightness(1.08);
      transform: translateY(-3px);
    }

    .card-front::before, .card-front::after {
      content: "•   •";
      position: absolute;
      left: 7px;
      right: 7px;
      display: flex;
      justify-content: space-between;
      font-size: 11px;
      color: #6b3800;
    }
    .card-front::before { top: 5px; }
    .card-front::after { bottom: 5px; }

    .q-mark {
      font-family: 'Press Start 2P', monospace;
      font-size: 26px;
      color: #fffbe6;
      text-shadow: 3px 3px 0 #783f00;
      animation: floatQ 1.8s infinite ease-in-out;
    }

    @keyframes floatQ {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-4px); }
    }

    .card-back {
      transform: rotateY(180deg);
      border: 4px solid #fff;
      box-shadow: 0 6px 14px rgba(0,0,0,0.7);
    }

    .card-back.type-hira {
      background: radial-gradient(circle, #2563eb, #172554);
      border-color: #93c5fd;
    }

    .card-back.type-kanji {
      background: radial-gradient(circle, #7e22ce, #2e1065);
      border-color: #d8b4fe;
    }

    .card-back.type-thai {
      background: radial-gradient(circle, #059669, #064e3b);
      border-color: #6ee7b7;
    }

    .type-tag {
      position: absolute;
      top: 5px;
      font-family: 'DotGothic16', sans-serif;
      font-size: 10px;
      padding: 2px 6px;
      border-radius: 4px;
      background: rgba(0,0,0,0.5);
      color: #f1f5f9;
    }

    .card-text {
      font-weight: 900;
      line-height: 1.25;
      word-break: keep-all;
    }

    .type-hira .card-text {
      font-family: 'Noto Sans JP', sans-serif;
      font-size: clamp(14px, 1.9vw, 19px);
      color: #dbeafe;
    }

    .type-kanji .card-text {
      font-family: 'Noto Sans JP', sans-serif;
      font-size: clamp(18px, 2.4vw, 24px);
      color: #f3e8ff;
    }

    .type-thai .card-text {
      font-family: 'Prompt', sans-serif;
      font-size: clamp(13px, 1.6vw, 16px);
      color: #d1fae5;
    }

    .card.wrong {
      animation: shakeWrong 0.4s ease;
    }

    @keyframes shakeWrong {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-6px); }
      75% { transform: translateX(6px); }
    }

    /* ================= กองไพ่ที่จับคู่แล้วด้านข้าง ================= */
    .collected-panel {
      background: rgba(9, 16, 40, 0.85);
      border: 4px solid var(--q-gold);
      border-radius: 14px;
      padding: 14px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.6);
      backdrop-filter: blur(4px);
    }

    .panel-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 2px solid rgba(255, 202, 40, 0.35);
      padding-bottom: 10px;
      margin-bottom: 12px;
    }

    .panel-title {
      font-family: 'Press Start 2P', 'DotGothic16', sans-serif;
      font-size: 11px;
      color: var(--q-gold);
      line-height: 1.4;
    }

    .panel-count {
      font-family: 'Press Start 2P', monospace;
      font-size: 11px;
      background: #065f46;
      color: #6ee7b7;
      padding: 4px 8px;
      border-radius: 6px;
      border: 2px solid #34d399;
    }

    .collected-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
      max-height: 440px;
      overflow-y: auto;
    }

    .empty-deck-hint {
      text-align: center;
      padding: 28px 10px;
      color: #94a3b8;
      font-size: 14px;
      border: 2px dashed rgba(148, 163, 184, 0.3);
      border-radius: 10px;
      line-height: 1.6;
    }

    /* กองการ์ด 3 ใบที่ซ้อนรวมกันเป็นชุด */
    .matched-stack {
      background: linear-gradient(135deg, #102a43 0%, #09192f 100%);
      border: 2px solid #38bdf8;
      border-radius: 10px;
      padding: 10px;
      box-shadow: 0 4px 0 #040d1a, inset 0 0 12px rgba(56, 189, 248, 0.15);
      animation: slideInStack 0.4s cubic-bezier(0.18, 0.89, 0.32, 1.28);
      position: relative;
    }

    @keyframes slideInStack {
      from { opacity: 0; transform: translateY(-12px) scale(0.92); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    .stack-badge {
      position: absolute;
      top: -8px;
      right: 10px;
      background: var(--q-gold);
      color: #3b1d00;
      font-family: 'Press Start 2P', monospace;
      font-size: 9px;
      padding: 3px 6px;
      border-radius: 4px;
      border: 2px solid #fff;
    }

    .stack-cards {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
      margin-top: 4px;
    }

    .mini-card {
      padding: 6px 8px;
      border-radius: 6px;
      text-align: center;
      font-weight: 700;
      border: 1.5px solid rgba(255,255,255,0.25);
    }

    .mini-card.hira {
      background: rgba(37, 99, 235, 0.35);
      color: #bfdbfe;
      font-family: 'Noto Sans JP', sans-serif;
      font-size: 13px;
    }

    .mini-card.kanji {
      background: rgba(147, 51, 234, 0.35);
      color: #f3e8ff;
      font-family: 'Noto Sans JP', sans-serif;
      font-size: 15px;
    }

    .mini-card.thai {
      grid-column: span 2;
      background: rgba(5, 150, 105, 0.35);
      color: #a7f3d0;
      font-family: 'Prompt', sans-serif;
      font-size: 14px;
    }

    /* ปุ่มควบคุม */
    .controls {
      margin-top: 20px;
      display: flex;
      gap: 14px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .mario-btn {
      font-family: 'Press Start 2P', 'DotGothic16', sans-serif;
      font-size: 12px;
      padding: 12px 20px;
      background: var(--pipe-green);
      color: #fff;
      border: 4px solid #003800;
      border-radius: 8px;
      box-shadow: inset 3px 3px 0 #86efac, 0 5px 0 #002b00;
      cursor: pointer;
      text-shadow: 2px 2px 0 #003800;
    }

    .mario-btn:hover { filter: brightness(1.08); }
    .mario-btn:active {
      transform: translateY(3px);
      box-shadow: inset 3px 3px 0 #86efac, 0 2px 0 #002b00;
    }

    /* Modal ผ่านด่าน */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.84);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 50;
      padding: 20px;
    }

    .modal-backdrop.show { display: flex; }

    .modal-box {
      background: #0d152a;
      border: 5px solid var(--q-gold);
      box-shadow: 0 0 40px rgba(255, 202, 40, 0.5);
      padding: 28px 24px;
      max-width: 460px;
      width: 100%;
      text-align: center;
      border-radius: 14px;
    }

    .modal-title {
      font-family: 'Press Start 2P', monospace;
      font-size: 17px;
      color: var(--q-gold);
      margin-bottom: 14px;
      line-height: 1.5;
    }

    .modal-desc {
      font-family: 'DotGothic16', sans-serif;
      font-size: 16px;
      color: #dbeafe;
      margin-bottom: 22px;
      line-height: 1.7;
    }
  </style>
</head>
<body>

  <!-- ฉากหลังภูเขา เมฆ มาริโอ้ และพื้นอิฐ -->
  <div class="mario-scenery" aria-hidden="true">
    <div class="stars"></div>
    <div class="cloud cloud-1"></div>

    const STAGE_SIZE = 6;
    const STAGES = [];
    for (let i = 0; i < ALL_VOCAB.length; i += STAGE_SIZE) {
      STAGES.push(ALL_VOCAB.slice(i, i + STAGE_SIZE));
    }

    let currentStageIndex = 0;
    let clearedStages = new Set();
    let flippedCards = [];
    let matchedCount = 0;
    let totalScore = 0;
    let flips = 0;
    let lockBoard = false;

    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function playTone(freq, type, duration, delay = 0) {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(freq, audioCtx.currentTime + delay);
      gain.gain.setValueAtTime(0.12, audioCtx.currentTime + delay);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + delay + duration);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start(audioCtx.currentTime + delay);
      osc.stop(audioCtx.currentTime + delay + duration);
